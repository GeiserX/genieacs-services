<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388E3C"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
  </g>

  <!-- Gear/service icon -->
  <g transform="translate(100, 100)">
    <!-- Outer gear -->
    <circle cx="0" cy="0" r="40" fill="url(#glow)" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <!-- Gear teeth -->
    <rect x="-5" y="-45" width="10" height="12" rx="2" fill="#ffffff" opacity="0.7"/>
    <rect x="-5" y="33" width="10" height="12" rx="2" fill="#ffffff" opacity="0.7"/>
    <rect x="-45" y="-5" width="12" height="10" rx="2" fill="#ffffff" opacity="0.7"/>
    <rect x="33" y="-5" width="12" height="10" rx="2" fill="#ffffff" opacity="0.7"/>
    <!-- Center play/service indicator -->
    <polygon points="-8,-12 12,0 -8,12" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Title -->
  <text x="195" y="95" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">
    GenieACS Services
  </text>

  <!-- Subtitle -->
  <text x="197" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#ffffff" opacity="0.65" letter-spacing="0.3">
    Systemd and Supervisord service files for GenieACS
  </text>

  <!-- Decorative: service status on right -->
  <g transform="translate(750, 50)" opacity="0.2">
    <circle cx="10" cy="10" r="5" fill="#4CAF50"/>
    <rect x="22" y="5" width="70" height="10" rx="3" fill="#ffffff" opacity="0.5"/>
    <circle cx="10" cy="40" r="5" fill="#4CAF50"/>
    <rect x="22" y="35" width="55" height="10" rx="3" fill="#ffffff" opacity="0.4"/>
    <circle cx="10" cy="70" r="5" fill="#4CAF50"/>
    <rect x="22" y="65" width="65" height="10" rx="3" fill="#ffffff" opacity="0.35"/>
    <circle cx="10" cy="100" r="5" fill="#4CAF50"/>
    <rect x="22" y="95" width="50" height="10" rx="3" fill="#ffffff" opacity="0.3"/>
  </g>
</svg>
